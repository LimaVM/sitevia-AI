<!DOCTYPE html>
<html>
<head>
    <title>GPU Web Test</title>
</head>
<body>
    <h1>Teste GPU - Upload de Imagem</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <button type="submit">Enviar</button>
    </form>
    {% if result_image %}
        <h2>Imagem processada:</h2>
        <img src="{{ result_image }}" width="512">
    {% endif %}
</body>
</html>
